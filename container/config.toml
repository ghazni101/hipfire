# Serve config (read via HIPFIRE_HOME=/opt/hipfire/home).
#
# Single-slot by default: the multi-slot engine is feat/multislot work and
# its profile lives on that branch — 2 slots, dynamic KV pool hard-capped at
# 131072 (flash partials are sized min(pool, 131072); a larger pool overruns
# the partials sub-view), prefill chunk 2048 (proven value on the ornith
# box; matches the audit-branch scheduler chunk of min(cap, 2048)). Restore
# that profile only on builds that include the slot engine, and note the
# pool preflight keeps an 8 GiB headroom, which refuses on <=16 GB UMA
# boxes entirely (see the 2026-08-26 VL battery findings).
[serve]
multi_slot = false
