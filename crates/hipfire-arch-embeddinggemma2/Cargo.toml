[package]
name = "hipfire-arch-embeddinggemma2"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EmbeddingGemma 2 single-vector embedding architecture (bidirectional Gemma-4-family encoder, PLE, sliding/full hybrid, 768-d Matryoshka head) for hipfire"

[dependencies]
hipfire-runtime = { path = "../hipfire-runtime" }
hipfire-config = { path = "../hipfire-config" }
rdna-compute = { path = "../rdna-compute" }
half = "2"
serde_json = "1"

[features]
default = []
# GPU-only examples (parity / inspection), off the default build like the
# qwen35-embed `lab` gate.
lab = []
